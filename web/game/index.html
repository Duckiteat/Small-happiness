<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작은 행복</title>
<!-- 회색 상자 화면 (구현-계획 N2-3). 이 파일은 틀이다: npm run game 이 엔진과 자료를 넣어 web/game/index.html 을 만든다 -->
<style>
:root {
  --bg: #f6f4ef; --panel: #ffffff; --ink: #24221e; --muted: #77716a; --line: #d9d4ca;
  --box: #e7e3db; --box-near: #d8d2c6; --accent: #b4573a; --accent-ink: #ffffff; --ring: #b4573a; --done: #5f7f5a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1a18; --panel: #24221f; --ink: #ece7de; --muted: #a39b90; --line: #3b3833;
    --box: #2d2b27; --box-near: #383530; --accent: #e08a6a; --accent-ink: #1b1a18; --ring: #e08a6a; --done: #9cc293;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1a18; --panel: #24221f; --ink: #ece7de; --muted: #a39b90; --line: #3b3833;
  --box: #2d2b27; --box-near: #383530; --accent: #e08a6a; --accent-ink: #1b1a18; --ring: #e08a6a; --done: #9cc293;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
h1 { font-size: 1.1rem; margin: 0; }
#clock { font-variant-numeric: tabular-nums; font-weight: 600; }
#condition { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .8rem; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
select, button { font: inherit; }
select { max-width: 100%; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }

/* 무대: 방 전체 ↔ 하루씨 곁 */
#stage { background: var(--box); border-radius: 14px; padding: 16px; min-height: 120px; transition: background .4s, padding .4s; display: grid; gap: 10px; }
#stage[data-view="near"] { background: var(--box-near); }
#stage[data-view="near"][data-rung="guess"] { padding: 14px; }
#stage[data-view="near"][data-rung="narrow"] { padding: 12px; }
#stage[data-view="near"][data-rung="thing"] { padding: 10px; }
#room { display: flex; align-items: center; gap: 12px; }
.person { width: 36px; height: 36px; flex: none; border-radius: 50%; background: var(--panel); border: 2px solid var(--line); }
#stage[data-view="near"] .person { width: 44px; height: 44px; border-color: var(--accent); }
#doing { color: var(--muted); }

#scene { background: var(--panel); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
#stage[data-view="room"] #scene { opacity: .8; }
.scene-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.place { color: var(--muted); }
.status { margin-left: auto; font-size: .8rem; color: var(--muted); }
.s-closed { color: var(--done); }
.ladder { display: flex; gap: 4px; list-style: none; padding: 0; margin: 0; font-size: .8rem; }
.ladder li { flex: 1; text-align: center; padding: 2px 0; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
.ladder li.past { border-color: transparent; }
.ladder li.now { border-color: var(--accent); color: var(--ink); font-weight: 600; }
.node { justify-self: center; padding: 10px 18px; border-radius: 999px; border: 2px dashed var(--ring); text-align: center; }
.node.done { border-style: solid; border-color: var(--done); }
.node-label { font-weight: 600; }
.prose p { margin: 0 0 6px; }
.anchor { background: none; border: none; padding: 0 2px; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; border-radius: 999px; }
.anchor:disabled { cursor: default; }
.anchor.c-none:disabled { color: inherit; text-decoration: none; }
.anchor.c-open { text-decoration: none; outline: 2px dashed var(--ring); outline-offset: 2px; color: var(--ink); }
.anchor.c-closed { text-decoration: none; outline: 2px solid var(--done); outline-offset: 2px; color: var(--ink); }
.quiet { color: var(--muted); margin: 0; }

#fairy { background: var(--panel); border-radius: 12px; padding: 10px 14px; display: grid; gap: 8px; }
.options { display: flex; flex-wrap: wrap; gap: 6px; }
.option { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--accent); background: none; color: var(--ink); cursor: pointer; }

.controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.controls button { padding: 10px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.controls button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.controls button:disabled { opacity: .45; cursor: default; }
.sub { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sub button { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; }

#log { list-style: none; padding: 0; margin: 0; font-size: .9rem; display: grid; gap: 2px; max-height: 40vh; overflow-y: auto; }
#log time { color: var(--muted); font-variant-numeric: tabular-nums; }
#log .k-system { color: var(--muted); }
#log .k-advice { color: var(--accent); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>작은 행복</h1>
    <span id="clock"></span>
    <span id="condition" aria-label="하루씨의 컨디션"></span>
  </header>

  <section id="stage" data-view="room" aria-live="polite">
    <div id="room"><div class="person" aria-hidden="true"></div><span id="doing"></span></div>
    <div id="scene"></div>
  </section>

  <section id="fairy" aria-label="요정"></section>

  <div class="controls">
    <button id="next" type="button" class="primary">다음 일 ▸</button>
    <button id="plus" type="button">+30분</button>
    <button id="auto" type="button" aria-pressed="false">저절로 ▶</button>
  </div>
  <div class="sub">
    <select id="scenario" aria-label="시나리오"></select>
    <button id="save" type="button">저장</button>
    <button id="load" type="button">불러오기</button>
    <button id="restart" type="button">처음부터</button>
  </div>

  <ol id="log" aria-label="지난 일"></ol>
</main>

:"store","ko":"보관","en":"store","desc":"물건은 삭제되지 않고 보관된다","attrs":{"handles":true,"tidies":true}},{"key":"empty","ko":"비우기","en":"empty","desc":"내용물을 지우지 않고 보관으로 옮긴다","attrs":{"handles":true,"tidies":true}},{"key":"sell","ko":"판매","en":"sell","desc":"중고 거래로 양도한다 (슬라이스 밖)"},{"key":"move","ko":"옮기기","en":"move","attrs":{"handles":true}},{"key":"inspect","ko":"살피기","en":"inspect","aliases":["둘러보기","조사"],"desc":"가까이 보고 냄새를 맡아 정체와 위치를 알아낸다. 세계를 바꾸지 않고 앎을 바꾼다","attrs":{"against_odor":true}},{"key":"discard","ko":"버리기","en":"discard","aliases":["내다 버리기"],"desc":"물건을 쓰레기로 보낸다. 물건은 지워지지 않고 그 상태가 소멸(gone)로 바뀐다 (보관 장소는 위치 구현 뒤)","attrs":{"handles":true,"tidies":true,"upkeep":true,"against_odor":true}},{"key":"cook","ko":"요리하기","en":"cook","aliases":["요리","조리"],"desc":"재료를 익히거나 볶아 먹을 것을 만든다. 재료는 쓰여서 소멸(gone)로 바뀌고, 요리 냄새(구수함)가 난다. 식사 준비 시간에만 한다","attrs":{"handles":true}}]},{"category":"awareness","entries":[{"key":"unknown","ko":"모름","en":"unknown","desc":"아직 아무것도 느끼지 못했다","attrs":{"rank":0}},{"key":"noticed","ko":"알아챔","en":"noticed","desc":"뭔가 있다는 것은 안다. 정체나 위치는 모른다","attrs":{"rank":1}},{"key":"understood","ko":"이해함","en":"understood","desc":"무엇이 어디에 어떤 상태로 있는지 안다","attrs":{"rank":2}}]},{"category":"terminal","entries":[{"key":"gone","ko":"소멸","desc":"행동(닦기·치우기 등)으로 지워져 축에서 빠짐. 고정 상태에서 전이하는 곳. 조건은 = 만 쓴다"},{"key":"fixed","ko":"고정","desc":"상태가 진행된 뒤 남는 자국. 시간이 지나도 사라지지 않고, 상호작용(행동이나 이벤트)으로만 소멸로 옮겨간다. 조건은 = 만 쓴다"}]},{"category":"durability","entries":[{"key":"weak","ko":"취약","desc":"부위 내구 배율 0.5배 (평균의 1/2)","attrs":{"mult100":50}},{"key":"average","ko":"평균","desc":"부위 내구 배율 1배","attrs":{"mult100":100}},{"key":"strong","ko":"강점","desc":"부위 내구 배율 1.5배","attrs":{"mult100":150}},{"key":"very_strong","ko":"큰 강점","desc":"부위 내구 배율 2배","attrs":{"mult100":200}}]},{"category":"event_type","entries":[{"key":"tick","ko":"시간 흐름","desc":"시계가 시간을 흘려보냄"},{"key":"day_open","ko":"하루 열림"},{"key":"day_close","ko":"하루 닫힘"},{"key":"week_close","ko":"주 마감"},{"key":"absence","ko":"부재","desc":"비운 날 수만큼 한꺼번에 흐른 시간"},{"key":"state_changed","ko":"상태 변화"},{"key":"external_event","ko":"외부 사건","desc":"시나리오가 정한, 세계 밖에서 온 일(정전·문 열림). 원인이 없고 바로 뒤의 상태 변화가 이 사건의 결과다"},{"key":"placed","ko":"놓임 바뀜","desc":"물건의 받치는 것(on)이나 담긴 곳(in)이 바뀜"},{"key":"instance_created","ko":"개체 생김","desc":"정의의 인스턴스가 세계에 처음 생김"},{"key":"effect_request","ko":"효과 요청","desc":"소유자에게 상태 변경을 요청"},{"key":"stage_advanced","ko":"단계 진행","attrs":{"via_kinds":["progress"]}},{"key":"symptom_shown","ko":"증상 나타남"},{"key":"resource_low","ko":"자원 부족"},{"key":"resource_empty","ko":"자원 바닥"},{"key":"action_done","ko":"행동 완료","attrs":{"via_kinds":["offer"]}},{"key":"action_blocked","ko":"행동 막힘"},{"key":"commitment_due","ko":"약속 시각"},{"key":"delayed_effect","ko":"지연 효과 발동"},{"key":"delay_scheduled","ko":"지연 예약","desc":"규칙의 조건이 성립해 발화 시각이 정해짐","attrs":{"via_kinds":["rule"]}},{"key":"delay_fired","ko":"지연 발화","desc":"발화 시각에 조건이 여전히 맞아 결과가 생김","attrs":{"via_kinds":["rule"]}},{"key":"delay_cancelled","ko":"지연 취소","desc":"발화 시각에 조건이 풀려 있어 아무 일도 없음","attrs":{"via_kinds":["rule"]}},{"key":"event_fired","ko":"이벤트 발생"},{"key":"choice_made","ko":"선택"},{"key":"stimulus_perceived","ko":"감각","desc":"감각 자체(드라이한 감각질)를 느끼기 시작하거나 그침. 무엇에서 온 것인지는 모른 채 (내면-설계 2장)","attrs":{"via_kinds":["sense","offer"]}},{"key":"awareness_up","ko":"인지 상승","attrs":{"via_kinds":["sense","offer"]}},{"key":"awareness_changed","ko":"앎 바뀜","desc":"다시 보니 본 단계가 달라짐 (짙어짐, 없어짐, 다시 남)","attrs":{"via_kinds":["sense","offer"]}},{"key":"habit_formed","ko":"습관 형성"},{"key":"contact","ko":"접촉","desc":"두 운반체가 닿음"},{"key":"retract","ko":"철회","desc":"사건을 지우지 않고 철회 표시"},{"key":"text_ready","ko":"문장 준비"},{"key":"saved","ko":"저장됨"},{"key":"condition_changed","ko":"컨디션 변화"},{"key":"mode_entered","ko":"모드 진입"},{"key":"action_chosen","ko":"행동 선택","desc":"인물이 스스로 다음 행동을 고름","attrs":{"via_kinds":["offer"]}},{"key":"reflex","ko":"반사","desc":"감각 자체에 곧바로 붙는 몸의 반응 (무조건반사·조건반사). 원인은 그 감각"},{"key":"reflex_learned","ko":"조건반사가 생김","desc":"어떤 감각이 다른 감각을 예고한다는 것을 몸이 배움. 원인은 마지막으로 짝지어 겪은 감각"},{"key":"ladder_moved","ko":"심상 사다리","desc":"머무는 곳의 냄새가 무엇인지 아는 자리(느낌 → 짐작 → 좁힘 → 정체)가 열리거나 옮겨지거나 닫힘. 후보 종류의 맨 앞이 믿는 종류다. 원인은 계산에 읽은 상태·숙련·정체의 앎 중 가장 최근"},{"key":"mode_changed","ko":"모드가 바뀜","desc":"컨디션(여유·에너지·긴장)과 감정 축, 남은 집안일로 정해지는 모드(방전·터짐·몰아침·평온)가 바뀜. 고를 수 있는 행동과 걸리는 시간을 바꾼다. 원인은 그 판단에 읽은 상태를 마지막으로 정한 사건"},{"key":"released","ko":"방출","desc":"터짐: 쌓인 것을 몸이 먼저 방출함 (울기 등, 해석 전이라 요정이 닿지 않는다). 긴장·불쾌가 크게 줄고 에너지를 쓴다. 원인은 터짐으로 바뀐 모드"},{"key":"woke","ko":"잠에서 깸","desc":"잠이 끝나 컨디션이 돌아옴: 에너지는 기준으로, 쾌·불쾌·여유·긴장은 기준 쪽으로. 일정에서 오는 원천이라 원인이 없다"},{"key":"urgency_felt","ko":"못 참는 냄새","desc":"머무는 곳의 공기를 그 사람이 못 참는 세기로 느끼기 시작함(on) 또는 그침(off: 냄새가 약해짐 gone · 오래 맡아 둔해짐 habituated). 참는 동안 긴장이 쌓이고, 하던 쉼을 끊고 냄새 처리를 먼저 한다 (urgency.ts). 원인은 그 세기를 정한 사건, 둔해짐은 시작한 사건"},{"key":"urgency_endured","ko":"참음","desc":"못 참는 냄새 속에 endure_min분을 더 있었음 — 그만큼 긴장이 쌓인다 (bumps칸). 둔해지면 더 쌓이지 않는다. 원인은 그 못 참는 냄새"},{"key":"action_stopped","ko":"하던 일을 끊음","desc":"못 참는 냄새 때문에 하던 쉼을 끝나기 전에 그만둠. 끝난 것이 아니라 쉼의 효과(에너지·가라앉음)가 없다. 원인은 그 못 참는 냄새"},{"key":"passed_door","ko":"현관문을 지남","desc":"인물이 집을 나서거나(out) 들어오며(in) 현관문(사전 feature의 door)을 지나 문이 열림. 일정(외출 구간)이나 집을 비우는 행동이 정한 일이라 원인이 없다. 문은 규칙이 잠시 뒤 닫는다"},{"key":"event_opened","ko":"이벤트 열림","desc":"이벤트(EVT)의 핵심 — 심상 사다리를 타는 장소의 냄새 — 의 사다리가 열려 이벤트가 열림. 원인은 그 사다리 사건"},{"key":"scene_shown","ko":"장면","desc":"열린 이벤트에서 지금의 감각·사다리 칸·하루 구간·모드에 가장 구체적으로 맞는 장면이 바뀌어 작가의 원문이 보임 (조회만, 생성하지 않음). 원인은 그 칸을 정한 사다리 사건 또는 모드가 바뀐 사건"},{"key":"event_closed","ko":"이벤트 닫힘","desc":"이벤트의 닫힘 조건이 모두 맞거나 핵심의 사다리가 닫혀 이벤트가 닫힘. 원인은 그 사다리 사건 또는 조건을 마지막으로 채운 사건"},{"key":"image_formed","ko":"공감각 심상","desc":"서로 다른 감각 둘 이상의 감각질이 함께 느껴져 하나의 심상이 생기거나 깨짐. 원인은 그것을 갖추거나 깨뜨린 감각"},{"key":"body_response","ko":"몸의 반응","desc":"공감각 심상에 몸이 먼저 하는 반응 (해석 전 행동: 표정이 풀림, 떨림, 닭살). 원인은 그 심상"},{"key":"emotion_formed","ko":"감정","desc":"공감각 심상이 생길 때 생각(무엇에서 왔는지 · 며칠 안에 겪어 본 일 · 감정이 붙은 기억)과 합쳐 감정이 생김. 쾌·불쾌·안정 세 축을 움직인다. 원인은 그 심상"},{"key":"memory_formed","ko":"감정이 붙은 기억","desc":"그 일이 감각을 넘어 감정과 이어져 잊지 않는 기억이 됨, 또는 다른 감정으로 덧씌워짐. 원인은 그 감정 (이야기가 정한 지난 기억은 원인 없이 처음에)"},{"key":"overwhelmed","ko":"생각이 멈춤","desc":"불쾌가 높고 안정이 낮아 스트레스 임계를 넘음: 생각하고 해석하지 못한다 (감정이 생기지 않고, 요정의 조언이 닿지 않는다). 원인은 그 감정"},{"key":"thought_surfaced","ko":"갑자기 떠오름","desc":"다른 일로 생각하는 순간 아직 잊지 않은 미완의 생각(치울 일이 남은 것)이 떠오름. 같은 것은 하루에 한 번. 원인은 그때의 감정"},{"key":"options_formed","ko":"선택지","desc":"할 일이 없을 때 하루씨가 떠올린 선택지(쉼·집안일)가 둘 이상이고 지난번과 달라짐. 요정이 보는 것. 원인은 그 선택지들을 가능하게 한 가장 최근의 앎"},{"key":"advice_given","ko":"요정의 조언","desc":"요정이 어깨 위에서 하루씨의 선택지 하나를 권함 (플레이어의 입력이라 원인이 없다). 하루씨가 다음에 고를 때 닿는다"},{"key":"attention_drawn","ko":"주의를 돌림","desc":"플레이어가 줄글 속 눌리는 말(앵커)을 눌러 하루씨의 주의를 그쪽으로 돌림 (플레이어의 입력이라 원인이 없다). 바로 요정의 조언처럼 받아 두어, 하루씨가 다음에 고를 때 그 말이 이끄는 행동(사전 attention의 leads_to) 쪽으로 기운다. 들을지는 하루씨가 정한다"},{"key":"advice_ignored","ko":"조언을 듣지 않음","desc":"생각이 멈춰(스트레스 임계) 해석하지 못하거나, 권한 것이 지금의 선택지가 아니어서 듣지 않음. 원인은 그 조언"},{"key":"menu_planned","ko":"메뉴 구상","desc":"끼니가 시작되면 인물이 아는 재료(앎)로 만들 수 있는 요리법 중 하나를 고름. 원인은 그 판단에 쓴 가장 최근의 앎"},{"key":"outside_day_done","ko":"밖의 하루 끝","desc":"출근 구간이 끝나 귀가할 때 그날의 요약 카드(사전 outside_card)가 정해짐 — 뽑기는 개입(시드 난수)이라 원인이 없다. 바로 뒤에 카드가 움직인 감정 축·컨디션이 따른다 (outside.ts)"}]},{"category":"presence","entries":[{"key":"home","ko":"집에 있음","en":"home","desc":"하루씨가 집에 깨어 있다. 플레이어가 함께 본다. 단계는 행동·장면이 끝날 때마다 돈다","attrs":{"observed":true}},{"key":"meal","ko":"식사 준비","en":"meal","aliases":["요리 시간"],"desc":"하루씨가 집에서 식사를 준비하는 시간. 집에 있는 것과 같이 본다. 요리하기는 이 시간에만 한다. 이 구간이 시작되면 하루씨가 아는 재료로 메뉴를 구상한다 (요리-설계 10장)","attrs":{"observed":true,"plans_menu":true}},{"key":"out","ko":"외출","en":"out","aliases":["출근","부재"],"desc":"하루씨가 집에 없다. 플레이어도 보지 않는다. 일정한 간격으로 변화를 계산한다. 이 구간이 끝나 귀가하면 밖의 하루 카드를 cards만큼 뽑아 내면에 반영한다 (outside.ts)","attrs":{"observed":false,"leaves_home":true,"cards":{"min":1,"max":2,"tuned":false}}},{"key":"asleep","ko":"잠","en":"asleep","aliases":["수면"],"desc":"하루씨가 자고 있다. 플레이어가 보지 않는 시간으로 친다 (외출과 같은 간격). 깨면 컨디션이 돌아온다 (sleeps)","attrs":{"observed":false,"sleeps":true}}]},{"category":"condition","entries":[{"key":"reserve","ko":"여유","en":"reserve","aliases":["만족도"],"desc":"부정 방향 사건을 버티는 정도. 0이 평범한 하루. 숫자로 보이지 않는다"},{"key":"energy","ko":"에너지","en":"energy","desc":"행동할 수 있는 힘"},{"key":"tension","ko":"긴장","en":"tension","desc":"풀리지 않고 쌓인 것"}]},{"category":"mode","entries":[{"key":"drained","ko":"방전","en":"drained","desc":"거의 아무것도 못 하는 날. 에너지가 바닥이거나, 긴장이 높은데 에너지가 부족하면. 쉼만 할 수 있다","attrs":{"rank":1,"when_any":[["condition:energy@\u003c=empty"],["condition:tension@>=high","condition:energy@\u003c=low"]],"allows":["pastime"],"tuned":false}},{"key":"release","ko":"터짐","en":"release","desc":"쌓인 것이 방출되는 날 (울기 등). 긴장이 터질 듯하거나, 불쾌가 크고 안정이 불안정한데 에너지가 남아 있으면 몸이 먼저 방출한다 (해석 전, 요정이 닿지 않음)","attrs":{"rank":2,"when_any":[["condition:tension@>=bursting","condition:energy@>=little"],["mood:displeasure@>=strong","mood:stability@\u003c=uneasy","condition:energy@>=little"]],"releases":true,"tuned":false}},{"key":"surge","ko":"몰아침","en":"surge","desc":"한 가지를 긴 시간 몰아서 하는 날 (두 시간 청소 등). 긴장이 조금 이상이고 에너지가 충분한데 남은 집안일(미완)이 많으면, 집안일을 먼저 오래 한다","attrs":{"rank":3,"when_any":[["condition:tension@>=slight","condition:energy@>=full"]],"unfinished_at_least":2,"first":"upkeep","minutes_pct":300,"tuned":false}},{"key":"steady","ko":"평온","en":"steady","desc":"평소의 자율 행동 (위 어디에도 해당하지 않음)","attrs":{"rank":4,"tuned":false}}]},{"category":"action","entries":[{"key":"rest","ko":"쉬기","en":"rest","desc":"아무것도 안 하기도 포함. 앉아 쉬기. 여유를 올릴 수 있다 (쉼: 할 일이 없을 때 하루씨가 스스로 고른다, 내면-설계 12장)","attrs":{"pastime":true}},{"key":"cry","ko":"울기","en":"cry","desc":"긴장의 방출. 라벨 없이 상태로만 그린다"}]},{"category":"env_trait","entries":[{"key":"weather_effect","ko":"날씨 영향","en":"weather effect","desc":"날씨(햇빛·비·바람·소리)가 장소에 닿는 정도 (세계-설정 3장)"},{"key":"temp_swing","ko":"온도 변화","en":"temperature swing","desc":"하루·계절에 따라 온도가 오르내리는 정도"},{"key":"ventilation","ko":"환기","en":"ventilation","desc":"공기가 바뀌는 정도. 낮을수록 냄새가 오래 남는다"},{"key":"humidity","ko":"습기","en":"humidity","desc":"물기가 남는 정도. 높을수록 곰팡이가 잘 핀다"}]},{"category":"env_level","entries":[{"key":"very_low","ko":"매우 낮음","en":"very low","attrs":{"rank":0}},{"key":"low","ko":"낮음","en":"low","attrs":{"rank":1}},{"key":"mid","ko":"보통","en":"mid","attrs":{"rank":2}},{"key":"high","ko":"높음","en":"high","attrs":{"rank":3}}]},{"category":"feature","entries":[{"key":"odor","ko":"냄새 종류","en":"odor kind","desc":"냄새가 어떤 종류인가. 사다리 칸 번호가 곧 심각도(우선순위)다: 여러 종류가 섞이면 가장 심각한 종류가 이긴다 (>= 로 올리기만 한다). 냄새의 세기는 smell이 따로 정한다. 종류의 지식(원인 → 균주 → 유기화합물 → 냄새)은 odor_kind·compound·strain·odor_cause에 있다","attrs":{"sense":"smell","ladder":{"by":"smell","skill":"judging","kind_pct":50,"clear_pct":[100,100,67,67,34,34],"tuned":false},"levels":[{"key":"none","ko":"없음"},{"key":"savory","ko":"구수함"},{"key":"sour","ko":"시큼한 발효 냄새"},{"key":"musty","ko":"곰팡내"},{"key":"sulfur","ko":"황 냄새"},{"key":"putrid","ko":"썩는 냄새"}]}}]},{"category":"odor_kind","entries":[{"key":"savory","ko":"구수함","desc":"익히거나 볶을 때 나는 고소하고 구수한 냄새","attrs":{"rank":1,"feature":"odor","like":["sour"],"tuned":false}},{"key":"sour","ko":"시큼한 발효 냄새","desc":"식초나 젖산 같은 시큼한 냄새 (발효)","attrs":{"rank":2,"feature":"odor","like":["savory"],"tuned":false}},{"key":"musty","ko":"곰팡내","desc":"곰팡이와 젖은 흙 같은 퀴퀴한 냄새","attrs":{"rank":3,"feature":"odor","like":["sour"],"tuned":false}},{"key":"sulfur","ko":"황 냄새","desc":"썩은 달걀이나 익은 양배추 같은 황 화합물 냄새","attrs":{"rank":4,"feature":"odor","like":["putrid"],"tuned":false}},{"key":"putrid","ko":"썩는 냄새","desc":"고기나 생선이 썩는 역한 냄새","attrs":{"rank":5,"feature":"odor","like":["sulfur"],"tuned":false}}]},{"category":"compound","entries":[{"key":"acetic_acid","ko":"아세트산","en":"acetic acid","desc":"식초의 시큼한 냄새","attrs":{"odor":"sour","verified":false}},{"key":"hydrogen_sulfide","ko":"황화수소","en":"hydrogen sulfide","desc":"썩은 달걀 냄새","attrs":{"odor":"sulfur","verified":false}},{"key":"methanethiol","ko":"메탄티올","en":"methanethiol","desc":"썩은 양배추 같은 황 냄새","attrs":{"odor":"sulfur","verified":false}},{"key":"dimethyl_disulfide","ko":"디메틸 이황화물","en":"dimethyl disulfide","desc":"썩은 양배추나 마늘 같은 황 냄새","attrs":{"odor":"sulfur","verified":false}},{"key":"putrescine","ko":"푸트레신","en":"putr
